<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nilesh Jogal - Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .role {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .skill {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi, I'm Nilesh</h1>
    <p class="role">BCA Student &amp; Web Developer</p>
    <p class="bio">
      Welcome to my first GitHub project! Mane web development sikhvu ane nava projects banavva game che.
    </p>
    <div class="skills">
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">JavaScript</span>
      <span class="skill">PHP</span>
      <span class="skill">MySQL</span>
    </div>
    <a href="https://github.com" class="btn" target="_blank">My GitHub</a>
  </div>
</body>
</html>
